<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Implant HUD concept art: an eye inside a scanning reticle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1e2a2c"/>
      <stop offset="1" stop-color="#07090a"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.025)"/>
    </pattern>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b0f10"/>
      <stop offset=".35" stop-color="#0b0f10"/>
      <stop offset=".4" stop-color="#5ec2b7"/>
      <stop offset="1" stop-color="#1c4a45"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- apartment block silhouette -->
  <g fill="#0c1112" opacity=".9">
    <rect x="0" y="470" width="1280" height="250"/>
    <rect x="70" y="300" width="260" height="420"/>
    <rect x="930" y="250" width="290" height="470"/>
  </g>
  <g fill="#f2a541" opacity=".55">
    <rect x="110" y="340" width="22" height="16"/><rect x="170" y="400" width="22" height="16"/><rect x="250" y="340" width="22" height="16"/>
    <rect x="980" y="300" width="22" height="16"/><rect x="1100" y="360" width="22" height="16"/><rect x="1040" y="460" width="22" height="16"/>
  </g>
  <!-- eye -->
  <path d="M440 360 Q640 210 840 360 Q640 510 440 360Z" fill="#d9ded9" opacity=".92"/>
  <circle cx="640" cy="360" r="92" fill="url(#iris)"/>
  <circle cx="612" cy="332" r="14" fill="#fff" opacity=".8"/>
  <!-- HUD reticle -->
  <g fill="none" stroke="#5ec2b7" stroke-width="2.5">
    <circle cx="640" cy="360" r="190" stroke-dasharray="14 10" opacity=".7"/>
    <circle cx="640" cy="360" r="232" opacity=".35"/>
    <path d="M640 110v50M640 560v50M390 360h50M840 360h50"/>
  </g>
  <g font-family="monospace" font-size="20" fill="#5ec2b7">
    <text x="60" y="70">IMPLANT // VISUAL FEED: FILTERED</text>
    <text x="60" y="100" fill="#f2a541">STATUS: UNNOTICED</text>
    <text x="1220" y="70" text-anchor="end">REALITY FLASH [ READY ]</text>
  </g>
  <!-- glitch bars -->
  <g fill="#e5675b" opacity=".55">
    <rect x="700" y="240" width="160" height="5"/><rect x="420" y="452" width="120" height="4"/>
  </g>
  <rect width="1280" height="720" fill="url(#scan)"/>
</svg>
